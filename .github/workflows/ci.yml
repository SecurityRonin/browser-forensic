name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@f9802dca64a95eb881fd05dd3f4f16e53b97f2b3
    with:
      # The old ci.yml ran clippy, build, test and coverage on DEFAULT features
      # only — `--all-features` appears nowhere in it. Inheriting the `true`
      # default would widen every one of those gates at once.
      all-features: false
      # Preserved exactly from the old coverage job:
      #   cargo llvm-cov --workspace --summary-only --fail-under-lines 89.4
      # The floor is 89.4, not 89 — a regression backstop set against the
      # irreducible imperative shell of the TUI/MCP binaries after the
      # Humble-Object pass. Never raise it here; raise it when coverage improves.
      coverage-gate: floor
      coverage-floor: 89.4
